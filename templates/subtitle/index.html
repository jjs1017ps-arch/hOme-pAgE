<!DOCTYPE html>
<html lang="ko">

    <head>

        <meta charset="UTF-8">

        <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
        >

        <title>Subtitle AI</title>


        <style>

            * {
                box-sizing: border-box;
            }


            html {
                scroll-behavior: smooth;
            }


            body {
                margin: 0;

                background: #000;

                color: white;

                font-family: Arial, sans-serif;
            }


            /* =================================
               HERO
            ================================= */

            .hero {

                min-height: 160vh;

                background-image:
                        url("/static/bgimg/space5.jpg");

                background-size: cover;

                background-position: center center;

                background-attachment: fixed;

                display: flex;

                justify-content: center;

                align-items: center;

                position: relative;

                overflow: hidden;
            }


            /* 동영상 배경 */

            #heroVideo {

                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                object-fit: cover;

                display: none;

                z-index: 0;
            }


            /* 제목 */

            .title {

                position: relative;

                z-index: 1;

                font-size:
                        clamp(30px, 5vw, 70px);

                font-weight: 800;

                letter-spacing: 5px;

                text-align: center;

                text-shadow:
                        0 0 20px
                        rgba(255,255,255,0.7);

                max-width: 90%;

                line-height: 1.25;

                white-space: normal;

                word-break: keep-all;

                overflow-wrap: break-word;
            }


            /* =================================
               PLAYER
            ================================= */

            .player {

                min-height: 100vh;

                padding: 80px 8%;

                background:
                        rgba(0,0,0,0.95);
            }


            .song-title {

                font-size: 28px;

                font-weight: bold;

                margin-bottom: 40px;
            }


            .subtitle {

                min-height: 120px;

                display: flex;

                justify-content: center;

                align-items: center;

                text-align: center;

                font-size: 34px;

                font-weight: bold;

                line-height: 1.4;

                text-shadow:
                        0 0 15px black;

                padding: 20px;
            }


            /* =================================
               TIMELINE
            ================================= */

            .timeline {

                margin-top: 30px;
            }


            #progress {

                width: 100%;
            }


            .time {

                display: flex;

                justify-content: space-between;

                color: #888;

                margin-top: 5px;
            }


            /* =================================
               CONTROLS
            ================================= */

            .controls {

                display: flex;

                align-items: center;

                gap: 10px;

                flex-wrap: wrap;

                margin-top: 30px;
            }


            button {

                border: none;

                border-radius: 8px;

                padding: 10px 18px;

                background: #222;

                color: white;

                cursor: pointer;

                font-size: 15px;
            }


            button:hover {

                background: #444;
            }


            input {

                padding: 10px;

                border-radius: 8px;

                border: 1px solid #444;

                background: #111;

                color: white;
            }


            /* =================================
               YOUTUBE
            ================================= */

            .youtube {

                margin-top: 50px;

                display: flex;

                gap: 10px;

                flex-wrap: wrap;
            }


            #url {

                width: min(700px, 100%);
            }


            /* =================================
               STATUS
            ================================= */

            .status {

                margin-top: 20px;

                color: #aaa;

                white-space: pre-wrap;
            }


            audio {

                width: 100%;

                margin-top: 30px;
            }

        </style>

    </head>


    <body>


        <!-- =================================
             HERO
        ================================= -->

        <section class="hero">


            <video
                    id="heroVideo"
                    muted
                    loop
                    playsinline>
            </video>


            <div
                    class="title"
                    id="heroSubtitle">

                Subtitle AI

            </div>


        </section>



        <!-- =================================
             PLAYER
        ================================= -->

        <section class="player">


            <div
                    class="song-title"
                    id="songTitle">

                음악을 선택하세요

            </div>


            <div
                    class="subtitle"
                    id="subtitle">
            </div>



            <!-- 타임라인 -->

            <div class="timeline">


                <input
                        type="range"
                        id="progress"
                        min="0"
                        max="100"
                        value="0"
                >


                <div class="time">

            <span id="current">
                0:00
            </span>


                    <span id="duration">
                0:00
            </span>

                </div>


            </div>



            <!-- 컨트롤 -->

            <div class="controls">


                <button id="play">
                    ▶ 재생
                </button>


                <button id="back">
                    -5초
                </button>


                <button id="forward">
                    +5초
                </button>


                <span>
            자막 MS
        </span>


                <button id="minus">
                    -100
                </button>


                <input
                        id="offset"
                        type="number"
                        value="0"
                        step="10"
                        style="width:90px"
                >


                <button id="plus">
                    +100
                </button>


                <button id="bkbt">
                    배경 바꾸기
                </button>


            </div>



            <!-- YouTube -->

            <div class="youtube">


                <input
                        id="url"
                        type="text"
                        placeholder="YouTube URL"
                >


                <button id="analyze">
                    음원 불러오기
                </button>


            </div>



            <!-- 상태 -->

            <div
                    class="status"
                    id="status">

                YouTube 링크를 입력하세요.

            </div>


            <audio id="audio"></audio>


        </section>



        <script>


            /* =========================================
               AUDIO
            ========================================= */

            const audio =
                document.querySelector("#audio");


            audio.addEventListener(
                "ended",
                () => {

                    audio.currentTime = 0;

                    audio.play();

                }
            );



            /* =========================================
               BACKGROUND
            ========================================= */

            let number = 1;


            const bkbt =
                document.querySelector("#bkbt");


            const hero =
                document.querySelector(".hero");


            const heroVideo =
                document.querySelector("#heroVideo");



            bkbt.addEventListener(
                "click",
                () => {


                    /* 다음 번호 */

                    number++;


                    if (number > 5) {

                        number = 1;

                    }



                    /* =================================
                       4 = VIDEO
                    ================================= */

                    if (number === 4) {


                        console.log(
                            "MP4 배경으로 변경"
                        );


                        /* 기존 JPG 제거 */

                        hero.style.backgroundImage =
                            "none";



                        /* 영상 완전 초기화 */

                        heroVideo.pause();

                        heroVideo.removeAttribute(
                            "src"
                        );

                        heroVideo.load();



                        /* 영상 설정 */

                        heroVideo.muted =
                            true;

                        heroVideo.loop =
                            true;

                        heroVideo.playsInline =
                            true;



                        /* H.264 변환된 영상 */

                        heroVideo.src =
                            "/static/bgimg/space4_web.mp4";



                        /* 화면에 표시 */

                        heroVideo.style.display =
                            "block";



                        /* 로드 */

                        heroVideo.load();



                        /* 영상 데이터 로드 */

                        heroVideo.onloadeddata =
                            () => {


                                console.log(
                                    "space4_web.mp4 로드 성공"
                                );


                                heroVideo.currentTime =
                                    0;



                                heroVideo
                                    .play()
                                    .then(
                                        () => {


                                            console.log(
                                                "영상 재생 성공"
                                            );


                                            console.log(
                                                "paused:",
                                                heroVideo.paused
                                            );


                                            console.log(
                                                "width:",
                                                heroVideo.videoWidth
                                            );


                                            console.log(
                                                "height:",
                                                heroVideo.videoHeight
                                            );


                                        }
                                    )
                                    .catch(
                                        error => {


                                            console.error(
                                                "영상 재생 실패:",
                                                error
                                            );


                                        }
                                    );

                            };



                        /* 영상 오류 */

                        heroVideo.onerror =
                            () => {


                                console.error(
                                    "VIDEO ERROR:",
                                    heroVideo.error
                                );


                            };


                    }


                    /* =================================
                       1,2,3,5 = JPG
                    ================================= */

                    else {


                        console.log(
                            "JPG 배경으로 변경:",
                            number
                        );



                        /* 영상 정지 */

                        heroVideo.pause();



                        /* 영상 제거 */

                        heroVideo.removeAttribute(
                            "src"
                        );


                        heroVideo.load();



                        /* 영상 숨기기 */

                        heroVideo.style.display =
                            "none";



                        /* JPG 이름 */

                        const background =
                            `space${number}.jpg`;



                        /* JPG 적용 */

                        hero.style.backgroundImage =
                            `url("/static/bgimg/${background}")`;


                    }



                    console.log(
                        "현재 배경 번호:",
                        number
                    );


                }
            );



            /* =========================================
               ELEMENTS
            ========================================= */

            const subtitle =
                document.getElementById(
                    "subtitle"
                );


            const heroSubtitle =
                document.getElementById(
                    "heroSubtitle"
                );


            const progress =
                document.getElementById(
                    "progress"
                );


            const current =
                document.getElementById(
                    "current"
                );


            const duration =
                document.getElementById(
                    "duration"
                );


            const offset =
                document.getElementById(
                    "offset"
                );


            const status =
                document.getElementById(
                    "status"
                );


            const songTitle =
                document.getElementById(
                    "songTitle"
                );



            let subtitles = [];



            /* =========================================
               YOUTUBE
            ========================================= */

            document
                .getElementById("analyze")
                .addEventListener(
                    "click",
                    async () => {


                        const url =
                            document
                                .getElementById("url")
                                .value
                                .trim();



                        if (!url) {

                            status.textContent =
                                "YouTube URL을 입력하세요.";

                            return;

                        }



                        status.textContent =
                            "🎵 음원 다운로드 중...";


                        heroSubtitle.textContent =
                            "분석 중...";


                        subtitle.textContent =
                            "";



                        try {


                            const response =
                                await fetch("http://192.168.0.5:5000/youtube", {
                                    method: "POST",

                                    headers: {
                                        "Content-Type": "application/json"
                                    },

                                    body: JSON.stringify({
                                        url: url
                                    })
                                }
                            );


                            const data =
                                await response.json();



                            if (!response.ok) {

                                throw new Error(
                                    data.error ||
                                    "서버 오류"
                                );

                            }



                            /* 제목 */

                            songTitle.textContent =
                                data.title;


                            document.title =
                                data.title +
                                " - Subtitle AI";



                            /* 자막 */

                            subtitles =
                                data.subtitles ||
                                [];



                            /* 음원 */

                            audio.src =
                                data.audio;


                            audio.load();



                            heroSubtitle.textContent =
                                "Subtitle AI";


                            subtitle.textContent =
                                "";


                            status.textContent =
                                "✅ 분석 완료";


                        }
                        catch (error) {


                            console.error(error);


                            heroSubtitle.textContent =
                                "Subtitle AI";


                            subtitle.textContent =
                                "";


                            status.textContent =
                                "❌ 오류: " +
                                error.message;


                        }


                    }
                );



            /* =========================================
               PLAY
            ========================================= */

            document
                .getElementById("play")
                .addEventListener(
                    "click",
                    () => {


                        if (!audio.src)
                            return;



                        if (audio.paused) {

                            audio.play();

                        }
                        else {

                            audio.pause();

                        }


                    }
                );



            audio.addEventListener(
                "play",
                () => {

                    document
                        .getElementById("play")
                        .textContent =
                        "⏸ 일시정지";

                }
            );



            audio.addEventListener(
                "pause",
                () => {

                    document
                        .getElementById("play")
                        .textContent =
                        "▶ 재생";

                }
            );



            /* =========================================
               AUDIO TIME
            ========================================= */

            audio.addEventListener(
                "loadedmetadata",
                () => {

                    duration.textContent =
                        formatTime(
                            audio.duration
                        );

                }
            );



            audio.addEventListener(
                "timeupdate",
                () => {


                    const time =
                        audio.currentTime;



                    if (audio.duration) {

                        progress.value =
                            (time / audio.duration) *
                            100;

                    }



                    current.textContent =
                        formatTime(time);



                    updateSubtitle(time);


                }
            );



            /* =========================================
               PROGRESS
            ========================================= */

            progress.addEventListener(
                "input",
                () => {


                    if (!audio.duration)
                        return;



                    audio.currentTime =
                        (progress.value / 100) *
                        audio.duration;


                }
            );



            /* =========================================
               BACK 5
            ========================================= */

            document
                .getElementById("back")
                .onclick =
                () => {


                    audio.currentTime =
                        Math.max(
                            0,
                            audio.currentTime - 5
                        );


                };



            /* =========================================
               FORWARD 5
            ========================================= */

            document
                .getElementById("forward")
                .onclick =
                () => {


                    audio.currentTime += 5;


                };



            /* =========================================
               OFFSET -
            ========================================= */

            document
                .getElementById("minus")
                .onclick =
                () => {


                    offset.value =
                        Number(offset.value) -
                        100;


                    updateSubtitle(
                        audio.currentTime
                    );


                };



            /* =========================================
               OFFSET +
            ========================================= */

            document
                .getElementById("plus")
                .onclick =
                () => {


                    offset.value =
                        Number(offset.value) +
                        100;


                    updateSubtitle(
                        audio.currentTime
                    );


                };



            offset.addEventListener(
                "input",
                () => {


                    updateSubtitle(
                        audio.currentTime
                    );


                }
            );



            /* =========================================
               SUBTITLE
            ========================================= */

            function updateSubtitle(time) {


                if (!subtitles.length) {


                    heroSubtitle.textContent =
                        "Subtitle AI";


                    subtitle.textContent =
                        "";


                    return;


                }



                const correction =
                    Number(offset.value) /
                    1000;



                const correctedTime =
                    time - correction;



                const currentSubtitle =
                    subtitles.find(
                        item =>

                            correctedTime >=
                            item.start &&

                            correctedTime <
                            item.end
                    );



                if (currentSubtitle) {


                    heroSubtitle.textContent =
                        currentSubtitle.text;


                    subtitle.textContent =
                        currentSubtitle.text;


                }
                else {


                    heroSubtitle.textContent =
                        "Subtitle AI";


                    subtitle.textContent =
                        "";


                }

            }



            /* =========================================
               FORMAT TIME
            ========================================= */

            function formatTime(seconds) {


                if (!Number.isFinite(seconds)) {

                    return "0:00";

                }



                const minutes =
                    Math.floor(
                        seconds / 60
                    );



                const secondsPart =
                    Math.floor(
                        seconds % 60
                    )
                        .toString()
                        .padStart(2, "0");



                return (
                    minutes +
                    ":" +
                    secondsPart
                );

            }


        </script>

    </body>

</html>
